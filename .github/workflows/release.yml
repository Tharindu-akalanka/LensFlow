name: 🚀 Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Validate the release tag
  # ─────────────────────────────────────────────────────────────────
  validate:
    name: 🔍 Validate Release Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Extract version from tag
        id: extract
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "🏷️ Releasing version: $VERSION"

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Create GitHub Release with changelog notes
  # ─────────────────────────────────────────────────────────────────
  release:
    name: 📦 Create GitHub Release
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog section for this version
        id: changelog
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          # Extract the section for this version from CHANGELOG.md
          NOTES=$(awk "/^## \[$VERSION\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "LensFlow v${{ needs.validate.outputs.version }}"
          body: |
            ## 🚀 LensFlow v${{ needs.validate.outputs.version }}

            ${{ steps.changelog.outputs.notes }}

            ---
            **Full Changelog**: https://github.com/Tharindu-akalanka/LensFlow/blob/main/CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          generate_release_notes: true
