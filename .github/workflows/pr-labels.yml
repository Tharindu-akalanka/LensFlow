name: 🏷️ Auto Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  label:
    name: Apply Labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label PR by title prefix (Conventional Commits)
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title.toLowerCase();
            const labels = [];

            const labelMap = {
              'feat':     'feature',
              'fix':      'bug',
              'docs':     'documentation',
              'refactor': 'refactor',
              'test':     'testing',
              'chore':    'chore',
              'perf':     'performance',
              'ci':       'ci/cd',
              'style':    'style',
              'security': 'security',
              'hotfix':   'hotfix',
            };

            for (const [prefix, label] of Object.entries(labelMap)) {
              if (title.startsWith(prefix + ':') || title.startsWith(prefix + '(')) {
                labels.push(label);
              }
            }

            // Label by target branch
            const base = context.payload.pull_request.base.ref;
            if (base === 'main') labels.push('release');
            if (base === 'develop') labels.push('in-development');

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels,
              });
            }
